      content="Comprehensive directory and tracking ETF guide for 150+ global market indices across S&P, NASDAQ, MSCI, FTSE Russell, STOXX, Euronext, Nikkei, and more."

      name="keywords"

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MarketIndices.xyz",
        "url": "https://marketindices.xyz/",
        "description": "Comprehensive directory and tracking ETF guide for 140+ global market indices.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://marketindices.xyz/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
