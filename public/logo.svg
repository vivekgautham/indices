<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Background Gradient: Deep FinTech Obsidian to Midnight Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071018" />
      <stop offset="50%" stop-color="#0a1926" />
      <stop offset="100%" stop-color="#062319" />
    </linearGradient>

    <!-- Neon Emerald to Electric Cyan Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B87A" />
      <stop offset="50%" stop-color="#00DD94" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 221, 148, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 221, 148, 0.55)" />
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 221, 148, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 245, 255, 0.75)" />
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 221, 148, 0.35)" />
      <stop offset="100%" stop-color="rgba(0, 245, 255, 0.95)" />
    </linearGradient>

    <!-- Laser Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Apex Pulse Glow -->
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="48" height="48" rx="11" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="10.25" fill="none" stroke="rgba(0, 221, 148, 0.28)" stroke-width="1.2" />

  <!-- Inner Ambient Glow Corner -->
  <circle cx="38" cy="10" r="16" fill="rgba(0, 221, 148, 0.12)" filter="url(#laserGlow)" />

  <!-- Benchmark Pillars (Ascending Tiers) -->
  <rect x="9.5" y="25" width="6" height="14" rx="2" fill="url(#bar1Grad)" />
  <rect x="18.5" y="18" width="6" height="21" rx="2" fill="url(#bar2Grad)" />
  <rect x="27.5" y="11" width="6" height="28" rx="2" fill="url(#bar3Grad)" />

  <!-- Baseline Grid Axis -->
  <line x1="8" y1="39" x2="40" y2="39" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" stroke-linecap="round" />

  <!-- Outperforming Index Laser Curve (Emerald -> Cyan with glow) -->
  <polyline
    points="8,27 17.5,21 25.5,23.5 37.5,9.5"
    fill="none"
    stroke="rgba(0, 221, 148, 0.35)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#laserGlow)"
  />
  <polyline
    points="8,27 17.5,21 25.5,23.5 37.5,9.5"
    fill="none"
    stroke="url(#brandGrad)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Apex Beacon (The Breakthrough Node) -->
  <circle cx="37.5" cy="9.5" r="5" fill="rgba(0, 245, 255, 0.3)" filter="url(#pulseGlow)" />
  <circle cx="37.5" cy="9.5" r="2.8" fill="#FFFFFF" />
  <circle cx="37.5" cy="9.5" r="1.4" fill="#00F5FF" />
</svg>
